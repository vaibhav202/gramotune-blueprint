name: gramotune
description: "Gramotune: Android local music player. Composition root for the workspace."
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  audio_service: 0.18.19
  audio_session: 0.2.4
  drift_flutter: 0.3.1
  engine:
    path: ../packages/engine
  engine_api:
    path: ../packages/engine_api
  flutter_riverpod: 3.4.3
  go_router: 18.1.3
  music_library:
    path: ../packages/music_library
  permission_handler: 13.0.2
  platform_android:
    path: ../packages/platform_android
  skin:
    path: ../packages/skin
  sources:
    path: ../packages/sources
  ui_kit:
    path: ../packages/ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
