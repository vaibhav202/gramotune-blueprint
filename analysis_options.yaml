# Analyzer settings for every package in the workspace (M0.2).
# The lint set is recorded in docs/dev-environment.md §5.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by ffigen and jnigen; never edit and never lint (AGENTS §10).
    - packages/engine/lib/src/bindings/**
    - packages/platform_android/lib/src/bindings/**
    # Generated sources.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Build output and tool state.
    - "**/build/**"
    - "**/.dart_tool/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - prefer_final_locals
    - unawaited_futures
